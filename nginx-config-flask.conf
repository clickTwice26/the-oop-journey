# QuizPilot Flask Application Nginx Configuration
# Reverse proxy for Flask application on port 5000

server {
    server_name quizpilot.duovow.wiki;

    # Logs
    access_log /var/log/nginx/quizpilot_access.log;
    error_log /var/log/nginx/quizpilot_error.log;

    # Increase file upload size limits
    client_max_body_size 100M;
    client_body_timeout 120s;
    client_header_timeout 120s;

    # Proxy all traffic to Flask application
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeout for file uploads and AI processing
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Handle WebSocket connections (if needed for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files caching (optional optimization)
    location /static/ {
        proxy_pass http://localhost:5000;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/quizpilot.duovow.wiki/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quizpilot.duovow.wiki/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name quizpilot.duovow.wiki;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}
